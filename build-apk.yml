name: Build Champion Shift Agent APK

on:
  push:
    paths:
      - champion-shift-agent-source.zip
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: unzip -q champion-shift-agent-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build debug APK
        run: gradle --no-daemon -p champion-shift-agent :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: champion-shift-agent-debug
          path: champion-shift-agent/app/build/outputs/apk/debug/app-debug.apk
